<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="container">

        <div class="card">
            <h2>📚 Register Course</h2>

            <form action="http://localhost:8080/course/enrollCourse" method="post">

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email" name="emailId" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Course Name</label>
                    <input type="text" name="courseName" placeholder="Enter course name" required>
                </div>

                <button type="submit" class="primary-btn">
                    🚀 Enroll Now
                </button>

            </form>
            <a href="index.html" class="home-link">
                <button class="secondary-btn">
                    🏠 Home Page
                </button>
            </a>
        </div>
    </div>

</body>
</html>
